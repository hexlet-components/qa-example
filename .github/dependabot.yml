version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      all-github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      all-github-actions-major:
        patterns: ["*"]
        update-types: ["major"]
